- name: Install base packages
  apt:
    name:
      - git
      - curl
      - wget
      - jq
      - tar
      - vim
      - ca-certificates
      - apache2-utils
      - dnsutils
      - netcat-openbsd
    state: present

- name: Download oc client
  get_url:
    url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ ocp_version }}/openshift-client-linux.tar.gz"
    dest: /tmp/oc.tar.gz
    mode: '0644'

- name: Extract oc client
  unarchive:
    src: /tmp/oc.tar.gz
    dest: /usr/local/bin/
    remote_src: yes

- name: Download openshift-install
  get_url:
    url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ ocp_version }}/openshift-install-linux.tar.gz"
    dest: /tmp/install.tar.gz
    mode: '0644'

- name: Extract openshift-install
  unarchive:
    src: /tmp/install.tar.gz
    dest: /usr/local/bin/
    remote_src: yes

- name: Ensure binaries executable
  file:
    path: "{{ item }}"
    mode: '0755'
  loop:
    - /usr/local/bin/oc
    - /usr/local/bin/kubectl
    - /usr/local/bin/openshift-install

- name: Configure KUBECONFIG in bashrc
  blockinfile:
    path: /home/devops/.bashrc
    block: |
      export KUBECONFIG=/home/devops/openshift-install/cluster/auth/kubeconfig
      source <(oc completion bash)
    state: present